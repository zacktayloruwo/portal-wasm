<!doctype html>
<!--
  Static shell for the Census Discovery Portal.

  Everything inside the five <section class="portal-panel"> elements is built
  by JavaScript (src/*.js); this file only provides the fixed frame: one blue
  masthead holding the site title, the tabs and the EN/FR switch, the panels,
  the footer at the end of the page, and the loading overlay that covers the
  page until DuckDB-WASM and the data are ready.

  Text marked data-i18n="key" is filled in from data/meta.json by src/i18n.js;
  the English here is only a fallback shown before that runs.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Census Discovery Portal</title>
  <link rel="icon" href="favicon.ico" />
</head>
<body>
  <!-- Full-page overlay; src/main.js updates the status text and hides it once the first query returns. -->
  <div id="app-loading-overlay">
    <div class="portal-spinner"></div>
    <span id="app-loading-status">Loading…</span>
  </div>

  <!-- Masthead: title, tabs and language in one bar. data-tab is the URL hash the router (src/router.js) navigates to. -->
  <header class="portal-mast">
    <h1 class="portal-apptitle" data-i18n="apptitle">Census Discovery Portal</h1>
    <nav class="portal-tabs" role="tablist">
      <button type="button" role="tab" data-tab="search" data-i18n="search">Search by Controlled Vocabulary</button>
      <button type="button" role="tab" data-tab="search_kw" data-i18n="search_kw">Search by Keyword</button>
      <button type="button" role="tab" data-tab="visualize" data-i18n="visualize">Visualize</button>
      <button type="button" role="tab" data-tab="documentation" data-i18n="documentation">Documentation</button>
      <button type="button" role="tab" data-tab="about" data-i18n="about">About</button>
    </nav>
    <div class="portal-lang" role="group" aria-label="Language / Langue">
      <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
      <button type="button" data-lang="fr" lang="fr" aria-label="Français" aria-pressed="false">FR</button>
    </div>
  </header>

  <!-- One panel per tab (id = "panel-" + data-tab). Each module appends its own DOM here. -->
  <main>
    <section class="portal-panel" id="panel-search" hidden></section>
    <section class="portal-panel" id="panel-search_kw" hidden></section>
    <section class="portal-panel" id="panel-visualize" hidden></section>
    <section class="portal-panel" id="panel-documentation" hidden></section>
    <section class="portal-panel" id="panel-about" hidden></section>
  </main>

  <!-- Version strings come from the settings block in prep/prep_db.R via data/meta.json. -->
  <footer class="portal-footer">
    <span>App Version: <span id="footer-version"></span></span>
    <span>App Last Updated: <span id="footer-app-date"></span></span>
    <span>Database Last Updated: <span id="footer-db-date"></span></span>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
